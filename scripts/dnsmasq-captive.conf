# Drink Maker Bot — captive portal DNS hijack.
#
# Loaded by the dnsmasq instance NetworkManager spawns for `ipv4.method=shared`
# connections (i.e. the Hotspot connection). Rules here only affect AP clients
# on wlan0; the Pi's own resolver on eth0 is untouched.
#
# Install path: /etc/NetworkManager/dnsmasq-shared.d/captive.conf
#
# Pairs with /etc/NetworkManager/dispatcher.d/99-drinkbot-captive, which adds
# the iptables redirect from port 80 to the kiosk on port 3000.

# Hijack every DNS query to the Pi's AP gateway IP. Captive-portal probes
# from iOS and Android (captive.apple.com, connectivitycheck.gstatic.com,
# etc.) all resolve to us instead of the real internet, which is what
# triggers the OS to pop its captive-portal browser pointed at the kiosk.
address=/#/10.42.0.1

# Friendly hostname for the NFC tag URL. Redundant with the wildcard above
# but explicit — the tag will read `http://drinkbot.party/` and end up here.
address=/drinkbot.party/10.42.0.1
